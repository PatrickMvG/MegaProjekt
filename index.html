<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahlzeit – die Rezept-App</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <script src="assets/js/main.js" defer></script>
</head>

<body>
    <header class="c-header">
        <div class="c-icon-ueberschrift">
            <div class="icon">🍳</div>
            <div class="ueberschrift">Mahlzeit</div>
        </div>
        <div class="c-ueberraschung">
            <div class="icon-ueberraschung">
                🎲
            </div>
            <div class="text-ueberraschung">
                Überrasch mich
            </div>
        </div>
    </header>
    <main class="c-main">
        <section class="c-first-three">
            <div class="was">
                Was gibt es heute, Lena?
            </div>
            <div class="slogan">
                Entdecke Rezepte ohne lange Werbegeschichten – direkt auf den Punkt.
            </div>
            <div class="suche">
                <form class="eingabe" id="eingabe-id">
                    <button type="submit" class="btn1">🔍</button>
                    <input type="text" id="rezept-suche" name="suchebtn" placeholder="Rezept suchen (Arrabiata...)">
                    <button type="submit">Suche</button>
                </form>
                <div class="text-suchen">Nach Kategrorien Filtern</div>
            </div>
        </section>
        <section class="filter-btn">
            <div class="c-btn">
                <button class="alle" id="alle-btn">Alle</button>
            </div>
        </section>
        <section class="c-auswahl">
            <!-- <div class="box">
                <div class="box-pic"></div>
                <div class="box-name"><span class="name-span">ased</span></div>
                <div class="box-details"><span class="sorte">Desert</span> <span class="herkunft">Griechenland</span></div>
            </div> -->
        </section>


    </main>
    <footer class="c-footer">
        <div class="text-footer">
            Mahlzeit – Für Lena gebaut mit TheMealDB API · Entwickelt für entspanntes Kochen am Abend.
        </div>
    </footer>

</body>

</html>
